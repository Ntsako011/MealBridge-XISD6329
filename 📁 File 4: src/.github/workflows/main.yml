name: MealBridge CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Validate Files
        run: |
          if [ -f "index.html" ]; then
            echo "SUCCESS: Web frontend located."
          else
            echo "ERROR: Missing index.html" && exit 1
          fi

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Check Gradle Wrapper
        run: echo "Gradle wrapper ready for build execution."
